version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: dnshe-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - dnshe-network

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: dnshe-backend
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - TURSO_DATABASE_URL=${TURSO_DATABASE_URL}
      - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN}
    volumes:
      - /app/node_modules
    depends_on:
      - redis
    networks:
      - dnshe-network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: dnshe-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - backend
    networks:
      - dnshe-network

volumes:
  redis-data:

networks:
  dnshe-network:
    driver: bridge
